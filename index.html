<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Loan Ledger BETA</title>
<style>
:root{--bg:#f4f5fb;--c:#fff;--bd:#e6e8f0;--tx:#151a2d;--mu:#6b7390;--ac:#5b5bf0;--a2:#06b6d4;--red:#e5484d;--grn:#12a36b;--amb:#d98a0b;--sh:0 6px 24px #1b24470f}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d17;--c:#151828;--bd:#232842;--tx:#eceefa;--mu:#8e96b8;--ac:#7c83ff;--a2:#22d3ee;--red:#ff7a7f;--grn:#3dd6a0;--amb:#f2b24c;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:110px}
.w{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}h2{margin:0 0 6px;font-size:20px}h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ib{background:var(--c);border:1px solid var(--bd);border-radius:12px;width:40px;height:40px;font-size:18px;color:var(--tx)}
.hero{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh)}
.hero small{opacity:.85}.hero b{display:block;font-size:34px;letter-spacing:-1px;margin:2px 0 12px}
.pb{height:8px;background:#fff4;border-radius:8px;overflow:hidden;margin-bottom:8px}.pb i{display:block;height:100%;background:#fff;border-radius:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.t{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.t small{color:var(--mu);font-size:12px;display:block}.t b{font-size:18px;letter-spacing:-.3px}
.red{color:var(--red)}.amb{color:var(--amb)}.grn{color:var(--grn)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--c);outline:0}
input:focus,select:focus{border-color:var(--ac)}
.chips{display:flex;gap:8px;margin:10px 0 14px;overflow-x:auto}
.chip{padding:7px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--c);white-space:nowrap;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:13px;margin-bottom:9px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.row>div:nth-child(2){flex:1;min-width:0}.n{font-weight:600}.s{color:var(--mu);font-size:13px}.r{text-align:right}
.av{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;display:grid;place-items:center;font-weight:700}
.b{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:#8883}
.b.Overdue{color:var(--red)}.b.Active{color:var(--amb)}.b.Closed{color:var(--grn)}
.em{color:var(--mu);text-align:center;padding:18px}
.fab{position:fixed;right:18px;bottom:92px;border:0;border-radius:30px;padding:15px 22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--a2));box-shadow:0 8px 24px #5b5bf055}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--c) 85%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
nav a{flex:1;max-width:160px;text-align:center;font-size:11px;color:var(--mu);padding:6px;border-radius:12px}
nav a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--ac);background:#5b5bf014}
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:94vh;border-radius:24px 24px 0 0;background:var(--bg);color:var(--tx);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
#sc,#rcc{padding:18px 18px 30px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:11px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--c);cursor:pointer;font-weight:600;font-size:14px}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;border:0}.btn.d{color:var(--red)}
.bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--bd)}.kv span:first-child{color:var(--mu);white-space:nowrap}.kv span:last-child{text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 3px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-size:11px}td:nth-child(n+2),th:nth-child(n+2){text-align:right}
.big{font-size:32px;font-weight:700;letter-spacing:-1px;margin:8px 0 0}.pv{font-size:13px;color:var(--mu);margin-top:10px}
#ri{width:100%;border-radius:12px;border:1px solid var(--bd);background:#fff}
.cal{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.cal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal .hd b{font-size:16px}
.cal .hd button{background:none;border:0;font-size:24px;color:var(--ac);padding:2px 14px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cg i{font-style:normal;font-size:11px;color:var(--mu);padding:4px 0}
.cg a{position:relative;padding:10px 0;border-radius:12px;font-size:14px;cursor:pointer}.cg a.t0{background:var(--ac);color:#fff;font-weight:700}
.cg a u{position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amb)}
.cg a u.red{background:var(--red)}.cg a u.grn{background:var(--grn)}
.wa{display:inline-block;background:#25d366;color:#04210f;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;text-decoration:none;white-space:nowrap}
.row .wa{font-size:12px;padding:7px 11px}
.ib.pf{background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;font-weight:700;border:0}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}#pr img{width:100%}dialog{display:none!important}}
</style></head><body>
<div class="w"><div class="top"><h1 id="ttl">Overview</h1><div style="display:flex;gap:8px"><button class="ib pf" id="pf" onclick="prof()" style="display:none"></button><button class="ib" onclick="setts()">⚙</button></div></div><div id="v"></div></div>

<div id="pr"><img id="pri" alt=""></div>
<input type="file" id="imp" accept=".json" hidden onchange="imp(this)">

<script>
const BETA=true; /* true = test build (separate data). false = live build. */
const K=BETA?'lend.beta.v2':'lend.v2',NK=BETA?'lend.beta.n':'lend.n',$=s=>document.querySelector(s),sh=$('#sheet');
window.APP={K,col:BETA?'items_beta':'items',beta:BETA};
if(BETA){const b=document.createElement('div');b.textContent='BETA · test version · separate data';b.style.cssText='background:#f59e0b;color:#1a1200;font:700 12px system-ui,sans-serif;text-align:center;padding:4px';document.body.prepend(b);document.title='Loan Ledger BETA'}
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D&&D.b?D:{b:[],l:[],n:0,s:{biz:'',phone:'',rd:3}};
window.cloud={st:'init',email:'',err:''};window.getD=()=>D;window.setD=d=>{D=d};window.ROLE='init';window.PD={uid:'',loaded:false,me:null,l:[],b:[],r:[],p:[],cfg:{}};window.AD={ps:[],rq:[],pb:[],pp:[]};
let tab='home',fl='All',q='',C=()=>sh.close(),CV,FN;
const sv=()=>{if(ROLE==='partner')return;localStorage.setItem(K,JSON.stringify(D));window.cloudPush&&window.cloudPush()};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const B=id=>D.b.find(x=>x.id===id)||{name:'?'},Ln=id=>D.l.find(x=>x.id===id);
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const no=l=>'LN-'+String(l.no).padStart(4,'0'),sp=l=>l.pays.slice().sort((a,b)=>a.d.localeCompare(b.d));
function addM(ds,m){const[y,mo,d]=ds.split('-').map(Number),t=new Date(Date.UTC(y,mo-1+m,1)),
 last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)}
function calc(l){const t=l.per==='y'?l.months/12:l.months,int=l.amt*l.rate/100*t,tot=l.amt+int+(l.chg||0),paid=l.pays.reduce((s,p)=>s+p.a,0),
 bal=tot-paid,due=addM(l.date,l.months),dtd=Math.round((new Date(due)-new Date(today()))/864e5),
 st=Math.round(bal)<=0?'Closed':dtd<0?'Overdue':'Active';return{int,tot,paid,bal,due,dtd,st,od:st==='Overdue'?-dtd:0}}
const tag=c=>`<span class="b ${c.st}">${c.st}${c.od?' '+c.od+'d':''}</span>`;
const T=(a,b,c='')=>`<div class="t"><small>${a}</small><b class="${c}">${b}</b></div>`;
const f=(id,lab,v,a='')=>`<label>${lab}</label><input id="${id}" value="${esc(v)}" ${a}>`;
const sel=(id,lab,o,v,a='')=>`<label>${lab}</label><select id="${id}" ${a}>${o.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;
const MODES=['Cash','UPI','Bank transfer','Cheque'].map(x=>[x,x]);
function S(h,back){$('#sc').innerHTML=h;C=back||(()=>sh.close());if(!sh.open)sh.showModal();sh.scrollTop=0}
sh.addEventListener('close',render);sh.addEventListener('click',e=>{if(e.target===sh)sh.close()});

/* ---------- views ---------- */
function alerts(){return D.l.map(l=>({l,c:calc(l)})).filter(x=>x.c.st==='Overdue'||(x.c.st==='Active'&&x.c.dtd<=D.s.rd)).sort((a,b)=>a.c.dtd-b.c.dtd)}
function lcard(l,c,nm){return`<div class="row" onclick="lDet('${l.id}')"><div class="av">${esc(B(l.bid).name[0]||'?')}</div><div><div class="n">${esc(B(l.bid).name)}</div>
 <div class="s">${no(l)} · ${inr(l.amt)} · due ${fd(c.due)}</div></div><div class="r"><b>${inr(Math.max(c.bal,0))}</b><div>${tag(c)}</div></div></div>`}
function home(){const c=D.l.map(l=>({l,c:calc(l)})),S=f=>c.reduce((s,x)=>s+f(x.c,x.l),0),tot=S(a=>a.tot),pd=S(a=>a.paid),
 out=S(a=>Math.max(a.bal,0)),p=tot?Math.min(100,pd/tot*100):0,al=alerts(),act=c.filter(x=>x.c.st!=='Closed').length;
 return`<div class="hero"><small>Total outstanding</small><b>${inr(out)}</b><div class="pb"><i style="width:${p}%"></i></div><small>${p.toFixed(0)}% of ${inr(tot)} collected</small></div>
 <div class="sum">${T('Disbursed',inr(S((a,l)=>l.amt)))}${T('Collected',inr(pd))}${T('Overdue',inr(S(a=>a.st==='Overdue'?a.bal:0)),'red')}
 ${T('Due in 7 days',inr(S(a=>a.st==='Active'&&a.dtd<=7?a.bal:0)),'amb')}${T('Open loans',act+' · '+D.b.length+' borrowers')}${T('Interest receivable',inr(S(a=>a.int)))}</div>
 ${pendCard()}${cloudCard()}${'Notification'in window&&Notification.permission==='default'?`<div class="t" style="margin-top:12px"><b style="font-size:15px">Get due-date alerts</b><div class="s">Phone notification when loans are due or overdue.</div><div class="bar"><button class="btn p" onclick="askN()">Enable alerts</button></div></div>`:''}
 <h3>Needs attention</h3>${al.length?al.map(x=>`<div class="row" onclick="lDet('${x.l.id}')"><div class="av">${esc(B(x.l.bid).name[0])}</div><div><div class="n">${esc(B(x.l.bid).name)}</div>
 <div class="s ${x.c.st==='Overdue'?'red':'amb'}">${x.c.st==='Overdue'?'Overdue by '+x.c.od+' days':x.c.dtd?'Due in '+x.c.dtd+' days':'Due today'}</div></div><div class="r"><b>${inr(x.c.bal)}</b><div style="margin-top:6px">${waBtn(x.l)}</div></div></div>`).join(''):'<div class="em">All clear ✓</div>'}<h3>Due calendar</h3>${cal()}`}
function cloudCard(){const c=window.cloud;
 if(c.st==='out'||c.st==='err')return`<div class="t" style="margin-top:12px"><b style="font-size:15px">Sign in to sync</b><div class="s">${c.st==='err'?'Sync problem ('+esc(c.err)+'). ':''}Sign in with Google so your data is saved to the cloud and appears on every device.</div><div class="bar"><button class="btn p" onclick="cloudIn()">Sign in with Google</button></div></div>`;
 return`<div class="s" style="text-align:center;margin-top:10px">${c.st==='in'?'☁ Synced · '+esc(c.email):'☁ Connecting…'}</div>`}
let cm=0;
const DEFTPL=`Dear {name},

This is a gentle reminder from {business} regarding your loan {loan_no}.

Loan amount: {loan_amount}
Total payable: {total}
Paid so far: {paid}
Balance due: {balance}
Due date: {due_date} ({status})

Kindly arrange the payment by the due date. If you have already paid, please ignore this message.

Thank you,
{business}
{business_phone}`;
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';const cc=String(D.s.cc||'91').replace(/\D/g,'');if(d.length===10)d=cc+d;else if(d.length===11&&d[0]==='0')d=cc+d.slice(1);return d}
function waMsg(l){const c=calc(l),b=B(l.bid),st=c.st==='Closed'?'fully paid':c.st==='Overdue'?'overdue by '+c.od+' days':c.dtd===0?'due today':c.dtd===1?'due tomorrow':'due in '+c.dtd+' days',
 v={name:b.name,business:D.s.biz||'Your lender',business_phone:D.s.phone||'',loan_no:no(l),loan_amount:inr(l.amt),interest:inr(c.int),total:inr(c.tot),paid:inr(c.paid),balance:inr(Math.max(c.bal,0)),disbursed:fd(l.date),due_date:fd(c.due),status:st};
 return(D.s.tpl||DEFTPL).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/[ \t]+\n/g,'\n').trim()}
function waLink(l){const n=waNum(B(l.bid).phone);return n?`https://wa.me/${n}?text=${encodeURIComponent(waMsg(l))}`:''}
const waBtn=(l,t='WhatsApp')=>{const h=waLink(l);return h?`<a class="wa" href="${h}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t}</a>`:''};
function cal(){const t=today(),d0=new Date(),base=new Date(d0.getFullYear(),d0.getMonth()+cm,1),y=base.getFullYear(),m=base.getMonth(),n=new Date(y,m+1,0).getDate(),mp={};
 D.l.forEach(l=>{const c=calc(l),o=mp[c.due]||(mp[c.due]={});o[c.st==='Overdue'?'red':c.st==='Active'?'amb':'grn']=1});
 let h='<span></span>'.repeat(base.getDay());
 for(let d=1;d<=n;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,o=mp[k];
  h+=`<a class="${k===t?'t0':''}" onclick="dayDet('${k}')">${d}${o?`<u class="${o.red?'red':o.amb?'':'grn'}"></u>`:''}</a>`}
 return`<div class="cal"><div class="hd"><button onclick="cm--;render()">‹</button><b>${base.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button onclick="cm++;render()">›</button></div>
 <div class="cg">${[...'SMTWTFS'].map(x=>`<i>${x}</i>`).join('')}${h}</div><div class="s" style="margin-top:8px;text-align:center"><span class="red">●</span> overdue &nbsp; <span class="amb">●</span> due &nbsp; <span class="grn">●</span> paid</div></div>`}
function dayDet(k){const ls=D.l.filter(l=>calc(l).due===k),ps=[];D.l.forEach(l=>l.pays.forEach(p=>{if(p.d===k)ps.push({l,p})}));
 S(`<h2>${fd(k)}</h2><h3>Loans due (${ls.length})</h3>${ls.length?ls.map(l=>{const c=calc(l),b=B(l.bid);return`<div class="t" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><div><div class="n">${esc(b.name)}</div><div class="s">${no(l)} · balance ${inr(Math.max(c.bal,0))}</div></div>${tag(c)}</div>
 <div class="bar"><button class="btn" onclick="lDet('${l.id}')">Open</button>${b.phone?`<a class="btn" href="tel:${esc(b.phone)}" style="text-decoration:none">Call</a>`:''}${waBtn(l)}</div></div>`}).join(''):'<div class="s">No loans due this day</div>'}
 <h3>Received (${ps.length})</h3>${ps.length?ps.map(x=>`<div class="kv" onclick="lDet('${x.l.id}')"><span>${esc(B(x.l.bid).name)} · ${esc(x.p.mode||'')}</span><span>${inr(x.p.a)}</span></div>`).join(''):'<div class="s">No payments this day</div>'}
 <div class="bar"><button class="btn" onclick="sh.close()" style="margin-left:auto">Close</button></div>`)}
let RQ=null;
const P=id=>AD.ps.find(x=>x.id===id)||{name:'?',pct:0};
const comm=l=>{const c=calc(l),s=c.tot>0?Math.min(1,c.paid/c.tot):0;return c.int*(l.cpct||0)/100*s};
const ICO={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',bor:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',loans:'<path d="M4 6h16M4 12h16M4 18h10"/>',par:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M15 20a5 5 0 0 1 6-4"/>',req:'<path d="M5 4h14v16H5zM9 9h6M9 13h6"/>'};
const navH=a=>a.map(x=>`<a data-t="${x[0]}" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24">${ICO[x[0]]}</svg>${x[1]}${x[2]?` <b class="red">${x[2]}</b>`:''}</a>`).join('');
const kvh=(a,x)=>x?`<div class="kv"><span>${a}</span><span>${esc(x)}</span></div>`:'';
function shrink(f,m=1000,q=.6){return new Promise((ok,er)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=er;i.src=URL.createObjectURL(f)})}
const phBlock=(bid,lid)=>`<h3>Documents</h3><div class="bar" style="margin-top:0"><button class="btn" onclick="phLoad('${bid}','${lid}')">View</button><button class="btn" onclick="phAdd('aadhaar','${bid}','${lid}')">+ Aadhaar</button>${lid?`<button class="btn" onclick="phAdd('collateral','${bid}','${lid}')">+ Collateral</button>`:''}</div><div id="phv"></div>`;
async function phLoad(bid,lid){const el=$('#phv');el.innerHTML='<div class="s">Loading…</div>';const w=[['bid','==',bid]];if(ROLE==='partner')w.push(['pid','==',PD.uid]);
 try{const r=(await fs.q('pph',...w)).filter(x=>x.kind==='aadhaar'||!lid||x.lid===lid);el.innerHTML=r.length?r.map(x=>`<div style="margin:10px 0"><div class="s">${x.kind==='aadhaar'?'Aadhaar':'Collateral'}</div><img src="${x.d}" style="width:100%;border-radius:12px">${ROLE==='admin'?`<a class="red" onclick="phDel('${x.id}','${bid}','${lid}')">Delete photo</a>`:''}</div>`).join(''):'<div class="s">No photos yet</div>'}catch(e){el.textContent='Could not load ('+(e.code||e.message)+')'}}

function phAdd(kind,bid,lid){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;
